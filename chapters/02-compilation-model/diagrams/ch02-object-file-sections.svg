<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 740" width="780" height="740" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- Title -->
  <text x="350" y="32" text-anchor="middle" font-size="26" font-weight="bold" fill="#1976d2">Mach-O Object File Structure</text>

  <!-- Mach-O Header (grey) -->
  <rect x="100" y="55" width="340" height="55" rx="8" fill="#f5f5f5" stroke="#9e9e9e" stroke-width="2"/>
  <text x="270" y="77" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Mach-O Header</text>
  <text x="270" y="98" text-anchor="middle" font-size="11" font-family="monospace" fill="#555">magic: 0xFEEDFACF  cpu: ARM64  filetype: MH_OBJECT</text>

  <!-- Load Commands (grey) -->
  <rect x="100" y="118" width="340" height="50" rx="8" fill="#f5f5f5" stroke="#9e9e9e" stroke-width="2"/>
  <text x="270" y="140" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Load Commands</text>
  <text x="270" y="158" text-anchor="middle" font-size="11" font-family="monospace" fill="#555">LC_SEGMENT_64, LC_SYMTAB, LC_DYSYMTAB</text>

  <!-- __TEXT,__text (blue) -->
  <rect x="100" y="176" width="340" height="60" rx="8" fill="#e3f2fd" stroke="#1976d2" stroke-width="2"/>
  <text x="270" y="200" text-anchor="middle" font-size="16" font-weight="bold" fill="#1976d2">__TEXT,__text</text>
  <text x="270" y="222" text-anchor="middle" font-size="12" font-family="monospace" fill="#333">Machine code: _main, _static_helper</text>

  <!-- __TEXT,__cstring (blue) -->
  <rect x="100" y="244" width="340" height="50" rx="8" fill="#e3f2fd" stroke="#1976d2" stroke-width="2"/>
  <text x="270" y="266" text-anchor="middle" font-size="16" font-weight="bold" fill="#1976d2">__TEXT,__cstring</text>
  <text x="270" y="284" text-anchor="middle" font-size="12" font-family="monospace" fill="#333">String literals: "Hello\n", format strings</text>

  <!-- __DATA,__data (orange) -->
  <rect x="100" y="302" width="340" height="50" rx="8" fill="#fff3e0" stroke="#f57c00" stroke-width="2"/>
  <text x="270" y="324" text-anchor="middle" font-size="16" font-weight="bold" fill="#f57c00">__DATA,__data</text>
  <text x="270" y="342" text-anchor="middle" font-size="12" font-family="monospace" fill="#333">Initialized globals: global_var = 42</text>

  <!-- __DATA,__bss (orange) -->
  <rect x="100" y="360" width="340" height="50" rx="8" fill="#fff3e0" stroke="#f57c00" stroke-width="2"/>
  <text x="270" y="382" text-anchor="middle" font-size="16" font-weight="bold" fill="#f57c00">__DATA,__bss</text>
  <text x="270" y="400" text-anchor="middle" font-size="12" font-family="monospace" fill="#333">Uninitialized globals: uninit_var (zeroed)</text>

  <!-- Symbol Table (grey) -->
  <rect x="100" y="418" width="340" height="110" rx="8" fill="#f5f5f5" stroke="#9e9e9e" stroke-width="2"/>
  <text x="270" y="442" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Symbol Table</text>
  <line x1="120" y1="450" x2="420" y2="450" stroke="#9e9e9e" stroke-width="1" opacity="0.5"/>

  <!-- Symbol table entries (monospace) -->
  <text x="130" y="470" font-size="12" font-family="monospace" fill="#1976d2">_main</text>
  <text x="270" y="470" font-size="12" font-family="monospace" fill="#333">T</text>
  <text x="310" y="470" font-size="11" fill="#555">(global, text)</text>

  <text x="130" y="490" font-size="12" font-family="monospace" fill="#1976d2">_static_helper</text>
  <text x="270" y="490" font-size="12" font-family="monospace" fill="#333">t</text>
  <text x="310" y="490" font-size="11" fill="#555">(local, text)</text>

  <text x="130" y="510" font-size="12" font-family="monospace" fill="#d32f2f">_printf</text>
  <text x="270" y="510" font-size="12" font-family="monospace" fill="#d32f2f">U</text>
  <text x="310" y="510" font-size="11" fill="#d32f2f">(undefined)</text>

  <text x="130" y="525" font-size="12" font-family="monospace" fill="#f57c00">_global_var</text>
  <text x="270" y="525" font-size="12" font-family="monospace" fill="#333">D</text>
  <text x="310" y="525" font-size="11" fill="#555">(global, data)</text>

  <!-- Relocation Entries (red) -->
  <rect x="100" y="536" width="340" height="55" rx="8" fill="#ffebee" stroke="#d32f2f" stroke-width="2"/>
  <text x="270" y="558" text-anchor="middle" font-size="16" font-weight="bold" fill="#d32f2f">Relocation Entries</text>
  <text x="270" y="580" text-anchor="middle" font-size="12" font-family="monospace" fill="#333">bl _printf &#x2192; needs address fixup at link time</text>

  <!-- RIGHT SIDE: Tool annotations -->
  <!-- nm annotation -->
  <rect x="510" y="440" width="50" height="24" rx="4" fill="#f5f5f5" stroke="#9e9e9e" stroke-width="1.5"/>
  <text x="535" y="457" text-anchor="middle" font-size="13" font-family="monospace" font-weight="bold" fill="#333">nm</text>
  <line x1="510" y1="452" x2="445" y2="470" stroke="#9e9e9e" stroke-width="1.5" marker-end="url(#arr-grey)"/>

  <!-- otool -l annotation -->
  <rect x="570" y="118" width="90" height="24" rx="4" fill="#f5f5f5" stroke="#9e9e9e" stroke-width="1.5"/>
  <text x="615" y="135" text-anchor="middle" font-size="13" font-family="monospace" font-weight="bold" fill="#333">otool -l</text>
  <line x1="570" y1="130" x2="445" y2="130" stroke="#9e9e9e" stroke-width="1.5" marker-end="url(#arr-grey)"/>
  <!-- otool bracket down to sections -->
  <line x1="615" y1="142" x2="615" y2="310" stroke="#9e9e9e" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="615" y1="310" x2="445" y2="310" stroke="#9e9e9e" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arr-grey)"/>

  <!-- strings annotation -->
  <rect x="540" y="260" width="80" height="24" rx="4" fill="#e3f2fd" stroke="#1976d2" stroke-width="1.5"/>
  <text x="580" y="277" text-anchor="middle" font-size="13" font-family="monospace" font-weight="bold" fill="#1976d2">strings</text>
  <line x1="540" y1="272" x2="445" y2="272" stroke="#1976d2" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- otool -tv annotation for __text -->
  <rect x="520" y="190" width="100" height="24" rx="4" fill="#e3f2fd" stroke="#1976d2" stroke-width="1.5"/>
  <text x="570" y="207" text-anchor="middle" font-size="13" font-family="monospace" font-weight="bold" fill="#1976d2">otool -tv</text>
  <line x1="520" y1="202" x2="445" y2="202" stroke="#1976d2" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- Bottom: key insight -->
  <rect x="50" y="615" width="680" height="55" rx="8" fill="#f5f5f5" stroke="#9e9e9e" stroke-width="1.5"/>
  <text x="390" y="638" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">Key Insight: An Object File is a Structured Container</text>
  <text x="390" y="658" text-anchor="middle" font-size="13" fill="#555">Code, data, symbols, and relocations are stored separately. The linker reads all of these to build the final executable.</text>

  <!-- Verify command -->
  <text x="390" y="700" text-anchor="middle" font-size="12" font-family="monospace" fill="#999">Try it: gcc -c hello.c &amp;&amp; nm hello.o &amp;&amp; otool -l hello.o</text>

  <!-- Section bracket: __TEXT segment -->
  <line x1="85" y1="176" x2="85" y2="294" stroke="#1976d2" stroke-width="2"/>
  <line x1="85" y1="176" x2="95" y2="176" stroke="#1976d2" stroke-width="2"/>
  <line x1="85" y1="294" x2="95" y2="294" stroke="#1976d2" stroke-width="2"/>
  <text x="80" y="240" text-anchor="end" font-size="12" font-weight="bold" fill="#1976d2" transform="rotate(-90, 80, 240)">__TEXT segment</text>

  <!-- Section bracket: __DATA segment -->
  <line x1="85" y1="302" x2="85" y2="410" stroke="#f57c00" stroke-width="2"/>
  <line x1="85" y1="302" x2="95" y2="302" stroke="#f57c00" stroke-width="2"/>
  <line x1="85" y1="410" x2="95" y2="410" stroke="#f57c00" stroke-width="2"/>
  <text x="80" y="360" text-anchor="end" font-size="12" font-weight="bold" fill="#f57c00" transform="rotate(-90, 80, 360)">__DATA segment</text>

  <!-- Arrowhead markers -->
  <defs>
    <marker id="arr-grey" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#9e9e9e"/>
    </marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#1976d2"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#d32f2f"/>
    </marker>
  </defs>
</svg>
