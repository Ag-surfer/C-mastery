<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 520" width="920" height="520" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- Title -->
  <text x="460" y="32" text-anchor="middle" font-size="26" font-weight="bold" fill="#1976d2">Preprocessor Text Substitution</text>

  <!-- LEFT BOX: Source Code -->
  <rect x="20" y="55" width="340" height="290" rx="8" fill="#e3f2fd" stroke="#1976d2" stroke-width="2"/>
  <text x="190" y="80" text-anchor="middle" font-size="16" font-weight="bold" fill="#1976d2">Source Code (hello.c)</text>
  <line x1="40" y1="90" x2="340" y2="90" stroke="#1976d2" stroke-width="1" opacity="0.3"/>

  <text x="35" y="115" font-size="13" font-family="monospace" fill="#333">#include &lt;stdio.h&gt;</text>
  <text x="35" y="140" font-size="13" font-family="monospace" fill="#333">#define MAX 100</text>
  <text x="35" y="165" font-size="13" font-family="monospace" fill="#333">#define SQUARE(x) ((x)*(x))</text>
  <text x="35" y="195" font-size="13" font-family="monospace" fill="#333">#ifdef DEBUG</text>
  <text x="35" y="215" font-size="13" font-family="monospace" fill="#333">  printf("debug\n");</text>
  <text x="35" y="235" font-size="13" font-family="monospace" fill="#333">#endif</text>
  <text x="35" y="270" font-size="13" font-family="monospace" fill="#333">int x = MAX;</text>
  <text x="35" y="295" font-size="13" font-family="monospace" fill="#333">int y = SQUARE(5);</text>

  <!-- Line numbers (subtle) -->
  <text x="345" y="115" text-anchor="end" font-size="10" fill="#999">1</text>
  <text x="345" y="140" text-anchor="end" font-size="10" fill="#999">2</text>
  <text x="345" y="165" text-anchor="end" font-size="10" fill="#999">3</text>
  <text x="345" y="195" text-anchor="end" font-size="10" fill="#999">4</text>
  <text x="345" y="215" text-anchor="end" font-size="10" fill="#999">5</text>
  <text x="345" y="235" text-anchor="end" font-size="10" fill="#999">6</text>
  <text x="345" y="270" text-anchor="end" font-size="10" fill="#999">7</text>
  <text x="345" y="295" text-anchor="end" font-size="10" fill="#999">8</text>

  <!-- CENTER: Arrow labeled "gcc -E" -->
  <line x1="370" y1="200" x2="440" y2="200" stroke="#333" stroke-width="2.5" marker-end="url(#arrowhead)"/>
  <rect x="378" y="175" width="55" height="20" rx="4" fill="#ffffff" stroke="#333" stroke-width="1"/>
  <text x="405" y="190" text-anchor="middle" font-size="13" font-weight="bold" font-family="monospace" fill="#333">gcc -E</text>

  <!-- RIGHT BOX: After Preprocessing -->
  <rect x="450" y="55" width="450" height="290" rx="8" fill="#e3f2fd" stroke="#1976d2" stroke-width="2"/>
  <text x="675" y="80" text-anchor="middle" font-size="16" font-weight="bold" fill="#1976d2">After Preprocessing (hello.i)</text>
  <line x1="470" y1="90" x2="880" y2="90" stroke="#1976d2" stroke-width="1" opacity="0.3"/>

  <!-- stdio.h expansion (greyed, italic) -->
  <text x="465" y="115" font-size="13" font-family="monospace" fill="#999" font-style="italic">// ~700 lines from stdio.h ...</text>

  <!-- Macro defs removed -->
  <text x="465" y="140" font-size="13" font-family="monospace" fill="#999" font-style="italic">// (macro definition removed)</text>
  <text x="465" y="165" font-size="13" font-family="monospace" fill="#999" font-style="italic">// (macro definition removed)</text>

  <!-- Conditional removed -->
  <text x="465" y="195" font-size="13" font-family="monospace" fill="#999" font-style="italic">// (removed &#x2014; DEBUG not defined)</text>

  <!-- Transformed lines -->
  <text x="465" y="270" font-size="13" font-family="monospace" fill="#333" font-weight="bold">int x = 100;</text>
  <text x="465" y="295" font-size="13" font-family="monospace" fill="#333" font-weight="bold">int y = ((5)*(5));</text>

  <!-- Red annotation boxes -->
  <!-- MAX -> 100 annotation -->
  <rect x="640" y="256" width="120" height="22" rx="4" fill="#ffebee" stroke="#d32f2f" stroke-width="1.5"/>
  <text x="700" y="272" text-anchor="middle" font-size="12" font-weight="bold" fill="#d32f2f">MAX &#x2192; 100</text>
  <line x1="640" y1="267" x2="607" y2="267" stroke="#d32f2f" stroke-width="1.5" marker-end="url(#arr-red)"/>

  <!-- SQUARE(5) expanded annotation -->
  <rect x="665" y="281" width="180" height="22" rx="4" fill="#ffebee" stroke="#d32f2f" stroke-width="1.5"/>
  <text x="755" y="297" text-anchor="middle" font-size="12" font-weight="bold" fill="#d32f2f">SQUARE(5) &#x2192; ((5)*(5))</text>
  <line x1="665" y1="292" x2="632" y2="292" stroke="#d32f2f" stroke-width="1.5" marker-end="url(#arr-red)"/>

  <!-- Bottom: Key takeaway -->
  <rect x="20" y="365" width="880" height="65" rx="8" fill="#f5f5f5" stroke="#9e9e9e" stroke-width="1.5"/>
  <text x="460" y="390" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">Key Insight: The Preprocessor is a Text Substitution Engine</text>
  <text x="460" y="412" text-anchor="middle" font-size="13" fill="#555">It has no knowledge of C syntax. It copies, replaces, and deletes text before the compiler ever sees the code.</text>

  <!-- Connecting lines from source to output: #include -->
  <line x1="360" y1="110" x2="450" y2="110" stroke="#1976d2" stroke-width="1" stroke-dasharray="4,3" opacity="0.5"/>
  <!-- Connecting lines: #define MAX -->
  <line x1="360" y1="135" x2="450" y2="135" stroke="#1976d2" stroke-width="1" stroke-dasharray="4,3" opacity="0.5"/>
  <!-- Connecting lines: #define SQUARE -->
  <line x1="360" y1="160" x2="450" y2="160" stroke="#1976d2" stroke-width="1" stroke-dasharray="4,3" opacity="0.5"/>
  <!-- Connecting lines: #ifdef block -->
  <line x1="360" y1="210" x2="450" y2="190" stroke="#1976d2" stroke-width="1" stroke-dasharray="4,3" opacity="0.5"/>

  <!-- Bottom annotations: what each directive does -->
  <text x="460" y="455" text-anchor="middle" font-size="12" fill="#555">
    <tspan x="150" dy="0" font-weight="bold" fill="#1976d2">#include</tspan>
    <tspan fill="#555"> = copy file contents</tspan>
    <tspan x="420" dy="0" font-weight="bold" fill="#1976d2">#define</tspan>
    <tspan fill="#555"> = define replacement rule</tspan>
    <tspan x="700" dy="0" font-weight="bold" fill="#1976d2">#ifdef / #endif</tspan>
    <tspan fill="#555"> = conditional inclusion</tspan>
  </text>

  <!-- Verify command -->
  <text x="460" y="490" text-anchor="middle" font-size="12" font-family="monospace" fill="#999">Try it: gcc -E hello.c -o hello.i &amp;&amp; wc -l hello.i</text>

  <!-- Arrowhead markers -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#d32f2f"/>
    </marker>
  </defs>
</svg>
