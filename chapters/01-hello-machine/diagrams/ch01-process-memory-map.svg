<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 800" width="780" height="800" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- Title -->
  <text x="350" y="35" text-anchor="middle" font-size="26" font-weight="bold" fill="#1976d2">Process Memory Map</text>

  <!-- Address labels (left side) -->
  <text x="175" y="78" text-anchor="end" font-size="13" fill="#999">High Addresses</text>
  <text x="175" y="140" text-anchor="end" font-size="12" font-family="monospace" fill="#d32f2f">0x16FDFF000</text>
  <text x="175" y="700" text-anchor="end" font-size="12" font-family="monospace" fill="#1976d2">0x100003F00</text>
  <text x="175" y="760" text-anchor="end" font-size="13" fill="#999">Low Addresses</text>

  <!-- Stack -->
  <rect x="200" y="90" width="300" height="110" rx="8" fill="#ffebee" stroke="#d32f2f" stroke-width="2"/>
  <text x="350" y="120" text-anchor="middle" font-size="20" font-weight="bold" fill="#d32f2f">Stack</text>
  <text x="350" y="145" text-anchor="middle" font-size="13" fill="#333">local vars, argc, argv</text>
  <text x="350" y="163" text-anchor="middle" font-size="13" fill="#333">return addresses</text>
  <text x="350" y="181" text-anchor="middle" font-size="13" fill="#888">Grows &#x2193;</text>

  <!-- Free gap -->
  <line x1="200" y1="220" x2="500" y2="220" stroke="#999" stroke-width="1" stroke-dasharray="6,4"/>
  <text x="350" y="252" text-anchor="middle" font-size="15" fill="#999">&#x2193;  &#x2191;</text>
  <text x="350" y="272" text-anchor="middle" font-size="12" fill="#999">(free)</text>
  <line x1="200" y1="290" x2="500" y2="290" stroke="#999" stroke-width="1" stroke-dasharray="6,4"/>

  <!-- Heap -->
  <rect x="200" y="305" width="300" height="90" rx="8" fill="#e8f5e9" stroke="#388e3c" stroke-width="2"/>
  <text x="350" y="335" text-anchor="middle" font-size="20" font-weight="bold" fill="#388e3c">Heap</text>
  <text x="350" y="358" text-anchor="middle" font-size="13" fill="#333">malloc'd memory</text>
  <text x="350" y="376" text-anchor="middle" font-size="13" fill="#888">Grows &#x2191;</text>

  <!-- BSS -->
  <rect x="200" y="415" width="300" height="70" rx="8" fill="#fff3e0" stroke="#f57c00" stroke-width="2"/>
  <text x="350" y="443" text-anchor="middle" font-size="20" font-weight="bold" fill="#f57c00">BSS</text>
  <text x="350" y="468" text-anchor="middle" font-size="13" fill="#333">Uninitialized globals</text>

  <!-- Data -->
  <rect x="200" y="500" width="300" height="70" rx="8" fill="#fff3e0" stroke="#f57c00" stroke-width="2"/>
  <text x="350" y="528" text-anchor="middle" font-size="20" font-weight="bold" fill="#f57c00">Data</text>
  <text x="350" y="553" text-anchor="middle" font-size="13" fill="#333">Initialized globals (= 42)</text>

  <!-- ROData / __cstring -->
  <rect x="200" y="585" width="300" height="70" rx="8" fill="#e3f2fd" stroke="#1976d2" stroke-width="2"/>
  <text x="350" y="611" text-anchor="middle" font-size="18" font-weight="bold" fill="#1976d2">ROData / __cstring</text>
  <text x="350" y="632" text-anchor="middle" font-size="13" fill="#333">String literals</text>
  <text x="350" y="648" text-anchor="middle" font-size="12" font-family="monospace" fill="#333">"Hello, World!\n"</text>

  <!-- Text / __text -->
  <rect x="200" y="670" width="300" height="70" rx="8" fill="#e3f2fd" stroke="#1976d2" stroke-width="2"/>
  <text x="350" y="696" text-anchor="middle" font-size="18" font-weight="bold" fill="#1976d2">Text / __text</text>
  <text x="350" y="717" text-anchor="middle" font-size="13" fill="#333">Machine code</text>
  <text x="350" y="733" text-anchor="middle" font-size="12" font-family="monospace" fill="#333">main() instructions</text>

  <!-- Annotations (right side) -->
  <!-- Arrow + label: Stack -->
  <text x="535" y="125" font-size="13" font-family="monospace" fill="#d32f2f">int local_var = 10;</text>
  <line x1="530" y1="120" x2="505" y2="120" stroke="#d32f2f" stroke-width="1.5" marker-end="url(#arr-red)"/>

  <!-- Arrow + label: BSS -->
  <text x="535" y="452" font-size="13" font-family="monospace" fill="#f57c00">int global_uninitialized;</text>
  <line x1="530" y1="447" x2="505" y2="447" stroke="#f57c00" stroke-width="1.5" marker-end="url(#arr-orange)"/>

  <!-- Arrow + label: Data -->
  <text x="535" y="537" font-size="13" font-family="monospace" fill="#f57c00">int global_initialized = 42;</text>
  <line x1="530" y1="532" x2="505" y2="532" stroke="#f57c00" stroke-width="1.5" marker-end="url(#arr-orange)"/>

  <!-- Arrow + label: ROData -->
  <text x="535" y="622" font-size="13" fill="#1976d2">printf format string</text>
  <line x1="530" y1="617" x2="505" y2="617" stroke="#1976d2" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- Arrow + label: Text -->
  <text x="535" y="707" font-size="13" fill="#1976d2">main() code</text>
  <line x1="530" y1="702" x2="505" y2="702" stroke="#1976d2" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- Arrowhead markers -->
  <defs>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#d32f2f"/>
    </marker>
    <marker id="arr-orange" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#f57c00"/>
    </marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#1976d2"/>
    </marker>
  </defs>
</svg>
