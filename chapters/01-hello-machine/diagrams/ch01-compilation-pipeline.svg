<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1820 220" width="1820" height="220" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- Title -->
  <text x="910" y="32" text-anchor="middle" font-size="26" font-weight="bold" fill="#1976d2">The Compilation Pipeline</text>

  <!-- hello.c -->
  <rect x="50" y="60" width="120" height="50" rx="8" fill="#e3f2fd" stroke="#1976d2" stroke-width="2"/>
  <text x="110" y="92" text-anchor="middle" font-size="17" font-weight="600" fill="#1976d2">hello.c</text>
  <text x="110" y="128" text-anchor="middle" font-size="11" fill="#666">Source Code</text>

  <!-- Arrow 1 -->
  <line x1="175" y1="85" x2="230" y2="85" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Preprocessor -->
  <rect x="235" y="52" width="150" height="66" rx="8" fill="#e3f2fd" stroke="#1976d2" stroke-width="2"/>
  <text x="310" y="82" text-anchor="middle" font-size="17" font-weight="600" fill="#1976d2">Preprocessor</text>
  <text x="310" y="106" text-anchor="middle" font-size="10" fill="#555">Expands #include,</text>
  <text x="310" y="118" text-anchor="middle" font-size="10" fill="#555">macros, #define</text>

  <!-- Arrow 2 -->
  <line x1="390" y1="85" x2="445" y2="85" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- hello.i -->
  <rect x="450" y="60" width="120" height="50" rx="8" fill="#e3f2fd" stroke="#1976d2" stroke-width="2"/>
  <text x="510" y="92" text-anchor="middle" font-size="17" font-weight="600" fill="#1976d2">hello.i</text>
  <text x="510" y="128" text-anchor="middle" font-size="11" fill="#666">gcc -E</text>

  <!-- Arrow 3 -->
  <line x1="575" y1="85" x2="630" y2="85" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Compiler -->
  <rect x="635" y="52" width="150" height="66" rx="8" fill="#e3f2fd" stroke="#1976d2" stroke-width="2"/>
  <text x="710" y="82" text-anchor="middle" font-size="17" font-weight="600" fill="#1976d2">Compiler</text>
  <text x="710" y="106" text-anchor="middle" font-size="10" fill="#555">C → Assembly</text>
  <text x="710" y="118" text-anchor="middle" font-size="10" fill="#555">(ARM64 instructions)</text>

  <!-- Arrow 4 -->
  <line x1="790" y1="85" x2="845" y2="85" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- hello.s -->
  <rect x="850" y="60" width="120" height="50" rx="8" fill="#e3f2fd" stroke="#1976d2" stroke-width="2"/>
  <text x="910" y="92" text-anchor="middle" font-size="17" font-weight="600" fill="#1976d2">hello.s</text>
  <text x="910" y="128" text-anchor="middle" font-size="11" fill="#666">gcc -S</text>

  <!-- Arrow 5 -->
  <line x1="975" y1="85" x2="1030" y2="85" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Assembler -->
  <rect x="1035" y="52" width="150" height="66" rx="8" fill="#e3f2fd" stroke="#1976d2" stroke-width="2"/>
  <text x="1110" y="82" text-anchor="middle" font-size="17" font-weight="600" fill="#1976d2">Assembler</text>
  <text x="1110" y="106" text-anchor="middle" font-size="10" fill="#555">Assembly → Object</text>
  <text x="1110" y="118" text-anchor="middle" font-size="10" fill="#555">(machine code)</text>

  <!-- Arrow 6 -->
  <line x1="1190" y1="85" x2="1245" y2="85" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- hello.o -->
  <rect x="1250" y="60" width="120" height="50" rx="8" fill="#e3f2fd" stroke="#1976d2" stroke-width="2"/>
  <text x="1310" y="92" text-anchor="middle" font-size="17" font-weight="600" fill="#1976d2">hello.o</text>
  <text x="1310" y="128" text-anchor="middle" font-size="11" fill="#666">gcc -c</text>

  <!-- Arrow 7 -->
  <line x1="1375" y1="85" x2="1430" y2="85" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Linker -->
  <rect x="1435" y="52" width="150" height="66" rx="8" fill="#e3f2fd" stroke="#1976d2" stroke-width="2"/>
  <text x="1510" y="82" text-anchor="middle" font-size="17" font-weight="600" fill="#1976d2">Linker</text>
  <text x="1510" y="106" text-anchor="middle" font-size="10" fill="#555">Resolves symbols,</text>
  <text x="1510" y="118" text-anchor="middle" font-size="10" fill="#555">combines objects</text>

  <!-- Arrow 8 -->
  <line x1="1590" y1="85" x2="1645" y2="85" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- a.out -->
  <rect x="1650" y="60" width="120" height="50" rx="8" fill="#e3f2fd" stroke="#1976d2" stroke-width="2"/>
  <text x="1710" y="92" text-anchor="middle" font-size="17" font-weight="600" fill="#1976d2">a.out</text>
  <text x="1710" y="128" text-anchor="middle" font-size="11" fill="#666">Executable</text>

  <!-- Arrowhead marker -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
  </defs>
</svg>
